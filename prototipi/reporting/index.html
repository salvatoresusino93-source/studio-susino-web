<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Strumento locale: non deve essere indicizzato se finisce online -->
  <meta name="robots" content="noindex, nofollow">
  <title>Refertario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="testata">
    <div class="testata__marchio" aria-hidden="true">R</div>
    <div class="testata__testi">
      <h1>Refertario</h1>
      <p>Spunta i positivi: i negativi si compilano da soli, nel tuo stile.</p>
    </div>
    <nav class="metodiche" id="metodiche" aria-label="Metodica"></nav>
  </header>

  <main class="layout">
    <!-- Colonna sinistra: scelta distretti e reperti -->
    <section class="colonna-controlli" aria-label="Composizione del referto">

      <div class="pannello">
        <div class="pannello__testa">
          <h2>Distretti</h2>
          <input type="search" id="cerca-distretto" placeholder="Cerca distretto…" aria-label="Cerca distretto">
        </div>
        <p class="aiuto">Puoi sceglierne più di uno: vengono uniti in un unico referto.</p>
        <div id="scelta-distretti"></div>
      </div>

      <div class="pannello">
        <h2>Frasi in testa</h2>
        <div class="pillole" id="premessa"></div>
      </div>

      <!-- Un pannello per ogni distretto scelto -->
      <div id="distretti-scelti"></div>

      <div class="pannello">
        <h2>Frasi in coda</h2>
        <div class="pillole" id="chiusura"></div>
      </div>
    </section>

    <!-- Colonna destra: referto -->
    <section class="colonna-referto" aria-label="Referto">
      <div class="pannello pannello--referto">
        <div class="barra">
          <label class="spunta">Lingua <select id="sel-lingua" aria-label="Lingua del referto"></select></label>
          <label class="spunta"><input type="checkbox" id="opt-titoli" checked> Titoli</label>
          <label class="spunta"><input type="checkbox" id="opt-tecnica" checked> Tecnica</label>
          <label class="spunta"><input type="checkbox" id="opt-conclusioni"> Conclusioni</label>
          <span class="segnaposto-conta" id="conta-segnaposto"></span>
        </div>
        <p class="avviso-lingua" id="avviso-lingua" hidden></p>
        <article class="referto" id="referto" aria-live="polite"></article>
        <div class="stile" id="stile" aria-live="polite"></div>
        <div class="azioni">
          <button type="button" class="btn btn--primario" id="btn-copia">Copia</button>
          <button type="button" class="btn" id="btn-stampa">Stampa</button>
          <button type="button" class="btn btn--tenue" id="btn-reset">Nuovo referto</button>
        </div>
        <p class="avviso">Le frasi «nuove» non vengono dal tuo archivio: verificale con <a href="review.html">la revisione</a>.</p>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="style/linter.js"></script>
  <script src="app.js"></script>
</body>
</html>
