# Verifica automatica del sito a ogni Pull Request e a ogni push su main.
# Non contatta il sistema di prenotazione né alcun servizio esterno:
# esegue i test Node, il controllo SEO del repository, la validazione HTML,
# il controllo di accessibilità (axe-core su tutte le pagine) e Lighthouse
# (prestazioni, accessibilità, buone pratiche, SEO) su sei pagine campione.
name: Verifica sito

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: CNAME del dominio (studiosusino.it)
        run: |
          if [ ! -f CNAME ]; then
            echo "::error file=CNAME::File CNAME mancante: senza di esso GitHub Pages abbandona il dominio studiosusino.it e il sito torna su github.io. Ripristinarlo con il solo contenuto 'studiosusino.it'."
            exit 1
          fi
          dominio=$(tr -d '[:space:]' < CNAME)
          if [ "$dominio" != "studiosusino.it" ]; then
            echo "::error file=CNAME::CNAME contiene '$dominio' invece di 'studiosusino.it' (senza www, senza https://, senza barra finale)."
            exit 1
          fi
          echo "CNAME corretto: $dominio"
      - name: Nessuna credenziale Google nel repository
        run: |
          if git grep -l -e '"private_key"' -e '"client_secret"' -- ':!*.md' ':!.github/workflows/verify.yml' >/dev/null 2>&1; then
            echo "::error::Trovato un file con private_key o client_secret: le credenziali Google non vanno committate. Revocare la chiave in Cloud Console e rimuoverla dalla storia."
            git grep -l -e '"private_key"' -e '"client_secret"' -- ':!*.md' ':!.github/workflows/verify.yml'
            exit 1
          fi
          echo "Nessuna credenziale nel repository."
      - name: Dipendenze dei controlli (playwright, axe-core, html-validate, lighthouse)
        run: npm ci
      - name: Test Node
        run: node --test tests/*.test.js
      - name: Controllo SEO (canonical, hreflang, sitemap, JSON-LD, link interni)
        run: node scripts/verifica-seo.js
      - name: Validazione HTML
        run: npx html-validate "*.html"
      - name: Browser per i controlli in pagina
        run: npx playwright install --with-deps chromium
      - name: Accessibilità (axe-core, WCAG 2.1 A/AA, tutte le pagine a 390 px)
        run: node scripts/verifica-accessibilita.js
      - name: Lighthouse (accessibilità ≥ 95, SEO ≥ 95, buone pratiche ≥ 90; prestazioni ≥ 90 solo avviso)
        run: npx lhci autorun
