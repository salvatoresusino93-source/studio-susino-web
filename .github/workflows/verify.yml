# Verifica automatica del sito a ogni Pull Request e a ogni push su main.
# Non contatta il sistema di prenotazione né alcun servizio esterno:
# esegue solo i test Node, il controllo SEO del repository e la validazione HTML.
name: Verifica sito

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test Node
        run: node --test tests/*.test.js
      - name: Controllo SEO (canonical, hreflang, sitemap, JSON-LD, link interni)
        run: node scripts/verifica-seo.js
      - name: Validazione HTML
        run: npx --yes html-validate "*.html"
